<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css"
    />
    <link rel="stylesheet" href="./css/index.css" />
    <title>Account Balance</title>
  </head>
  <body>
    <header>
      <h1>MANAGE YOUR ACCOUNT</h1>
      <p>Here you can manage your account income and expenses.</p>
    </header>
    <main>
      <hr />
      <section id="forms_container">
        <div>
          <h2>Income</h2>
          <form id="income">
            <div>
              <input
                type="text"
                id="in_description"
                name="in_description"
                placeholder="Salary"
                required
              />
              <input
                type="number"
                id="in_amount"
                name="in_amount"
                placeholder="1000.00"
                required
              />
            </div>
            <button type="button" id="income_add_btn" aria-label="Add income">+</button>
          </form>
        </div>
        <div>
          <h2>Expense</h2>
          <form id="expense">
            <div>
              <input
                type="text"
                id="ex_description"
                name="ex_description"
                placeholder="Groceries"
                required
              />
              <input
                type="number"
                id="ex_amount"
                name="ex_amount"
                placeholder="200.00"
                required
              />
            </div>
            <button type="button" id="expense_add_btn" aria-label="Add expense">+</button>
          </form>
        </div>
      </section>
      <section>
        <div id="table_panel">
          <h2>Records</h2>
          <button id="remove_btn">&#10005;</button>
        </div>
        <table id="records_table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Description</th>
              <th>Amount</th>
              <th>Type</th>
            </tr>
          </thead>
          <tbody id="records_body">
            <!-- Records will be dynamically inserted here -->
          </tbody>
        </table>
        <div id="total_income">Total Income: <strong>$0.00</strong></div>
        <div id="total_expense">Total Expense: <strong>$0.00</strong></div>
        <div id="balance">Balance: <strong>$0.00</strong></div>
      </section>
    </main>
    <footer></footer>

    <script src="./js/index.js" type="module"></script>
  </body>
</html>
